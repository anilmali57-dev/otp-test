<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTP Test</title>
</head>

<body>

<h2>OTP Test</h2>

<input
id="otp"
type="text"
maxlength="6"
autocomplete="one-time-code"
inputmode="numeric"
pattern = "[0-9]*"
maxlength="6"
autocorrect="off"
autocapitalize="off"
style="
width:200px;
height:50px;
font-size:24px;
text-align:center;
">

</body>
</html>
